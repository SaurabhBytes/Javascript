<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
        }
    
        #count {
            font-size: 100px;
            color: white;
            margin: 20px;
        }
    
        button {
            padding: 10px 30px;
            margin: 10px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    
        #increaseBtn { background-color: #4CAF50; color: white; }
        #decreaseBtn { background-color: #f44336; color: white; }
        #resetBtn { background-color: #2196F3; color: white; }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
</head>
<body>
    <h1 id="count">0</h1>
    <button id="increaseBtn">Increase</button>
    <button id="decreaseBtn">Decrease</button>
    <button id="resetBtn">Reset</button>

    <script src="script.js"></script>


</body>
</html>
